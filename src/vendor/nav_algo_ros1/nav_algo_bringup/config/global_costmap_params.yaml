global_costmap:
  global_frame: map
  robot_base_frame: base_link
  update_frequency: 1.0
  publish_frequency: 1.0
  rolling_window: false
  # The static_layer pulls width/height/resolution from the incoming
  # /traversability_grid message; these are first-tick fallbacks only.
  # Resolution is therefore driven by the trav grid (elevation_mapping
  # resolution) — set to 0.05 there to truly take effect. GOLD Nav2 Go2
  # global_costmap runs resolution 0.05.
  width: 100.0
  height: 100.0
  resolution: 0.05
  always_send_full_costmap: true
