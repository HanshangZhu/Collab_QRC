local_costmap:
  global_frame: map
  robot_base_frame: base_link
  update_frequency: 5.0
  publish_frequency: 5.0
  # Rolling 6×6 m window centred on the robot — matches GOLD Nav2 Go2
  # local_costmap (nav2_go2_full_stack.yaml: width/height 6, resolution 0.05).
  rolling_window: true
  width: 6.0
  height: 6.0
  resolution: 0.05    # was 0.10; gold runs the 5cm lattice on a 0.05 m grid
  always_send_full_costmap: true
