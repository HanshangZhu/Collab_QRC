# Simulation-only MPPI controller overlay.
#
# The base sim Nav2 YAMLs can point at the optional CUDA MPPI wrapper used by
# scripts/launch/nav_test_cuda_mppi.sh. Formal exploration benchmarks must run
# on a controller plugin that is present in the standard Humble Nav2 install, so
# this overlay forces the common executor to the upstream CPU MPPI controller.

controller_server:
  ros__parameters:
    FollowPath:
      plugin: "nav2_mppi_controller::MPPIController"
      use_cuda: false
