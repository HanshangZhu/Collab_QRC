# SmacPlannerLattice (global) — numeric values lifted verbatim from
# nav2_go2_full_stack.yaml's SmacPlannerHybrid block where compatible.
# (Hybrid → Lattice differs in motion model file; SE2 overlay uses Lattice
# with the diff 0.5m primitives.)
SmacLatticePlannerROS:
  tolerance:                    0.4
  allow_unknown:                true
  max_iterations:               1000000
  max_on_approach_iterations:   1000
  max_planning_time:            5.0
  lookup_table_size:            20.0
  smooth_path:                  true
  cache_obstacle_heuristic:     false

  # Diff motion primitives at 0.05 m resolution / 0.5 m turning radius —
  # the SE2 canonical lattice (matches Nav2 sim SE2 overlay). Shipped
  # under nav_algo_smac_ros1/sample_primitives/.
  lattice_filepath: ""   # empty → wrapper defaults to package share path

  # Penalties — aligned BYTE-FOR-BYTE to the GOLD Nav2 SE2 overlay
  # (nav2_se2_holonomic_overlay_sim.yaml, SmacPlannerLattice block), NOT the
  # old Hybrid/REEDS_SHEPP values. This is what makes ROS1 global paths
  # math-equivalent to the tuned Nav2-CUDA SE2 stack (2026-05-22).
  reverse_penalty:              8.0
  change_penalty:               1.0
  non_straight_penalty:         1.30
  cost_penalty:                 3.0
  retrospective_penalty:        0.015
  rotation_penalty:             1.50
  analytic_expansion_ratio:     3.5
  analytic_expansion_max_length: 3.0

  # Gold SE2 overlay sets allow_reverse_expansion: true.
  allow_reverse_expansion:      true

  smoother:
    max_iterations:             1000
    w_smooth:                   0.3
    w_data:                     0.2
    tolerance:                  1.0e-10
